name: Build Windows EXE (Tauri)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-tauri:
    name: Build Tauri Windows EXE (portable + setup + zip)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust (stable MSVC)
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: windows/src-tauri -> windows/src-tauri/target

      - name: Set up Node 20
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install Tauri CLI
        run: npm install --no-audit --no-fund

      - name: Sanity check (app files present)
        shell: pwsh
        run: |
          foreach ($f in @("app/index.html","app/audio/theme.mp3","app/audio/move-self.mp3",
                           "app/audio/capture.mp3","src-tauri/tauri.conf.json","src-tauri/src/main.rs",
                           "src-tauri/Cargo.toml","src-tauri/capabilities/default.json",
                           "src-tauri/icons/icon.ico")) {
            if (-not (Test-Path $f)) { Write-Error "missing $f"; exit 1 }
          }
          Write-Host "app files OK"

      - name: Build (tauri build → NSIS setup + standalone exe)
        run: npx tauri build

      - name: Collect, rename and zip artifacts (max compression)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ..\dist-out | Out-Null
          $ver = (Get-Content package.json | ConvertFrom-Json).version
          Write-Host "version = $ver"
          # --- portable: standalone native exe (needs WebView2, standard on Windows 10/11) ---
          $portable = "src-tauri\target\release\matin-chess.exe"
          if (-not (Test-Path $portable)) { Write-Error "portable exe missing: $portable"; exit 1 }
          Copy-Item $portable ("..\dist-out\MATIN-CHESS-v$ver-windows-portable.exe") -Force
          # --- setup: NSIS installer (LZMA solid; desktop shortcut + start menu + WebView2 bootstrap) ---
          $setup = Get-ChildItem "src-tauri\target\release\bundle\nsis" -Filter *.exe | Select-Object -First 1
          if (-not $setup) { Write-Error "setup exe missing in nsis bundle dir"; exit 1 }
          Write-Host ("nsis bundle: " + $setup.Name)
          Copy-Item $setup.FullName ("..\dist-out\MATIN-CHESS-v$ver-windows-setup.exe") -Force
          # --- zip the setup with 7-Zip max compression (user request) ---
          $sz = (Get-Command 7z -ErrorAction SilentlyContinue).Source
          if (-not $sz) { $sz = "C:\Program Files\7-Zip\7z.exe" }
          & $sz a -tzip -mx=9 "..\dist-out\MATIN-CHESS-v$ver-windows-setup.zip" "..\dist-out\MATIN-CHESS-v$ver-windows-setup.exe"
          if ($LASTEXITCODE -ne 0) { Write-Error "7z zip failed"; exit 1 }
          Get-ChildItem ..\dist-out | ForEach-Object { Write-Host ("artifact: " + $_.Name + "  " + $_.Length + " bytes") }
          if ((Get-ChildItem ..\dist-out).Count -lt 3) { Write-Error "artifacts missing"; exit 1 }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MATIN-CHESS-windows-tauri
          path: dist-out/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-tauri
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: MATIN-CHESS-windows-tauri
          path: dist

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body: |
            ## MATIN CHESS — نسخهٔ ویندوز (Windows Desktop Edition) 🪟

            همان بازی اندروید، همان ظاهر و متن‌ها، همان موتورها — این‌بار با پوستهٔ بومی Tauri:
            **حجم حدود ۷۰ مگابایت کمتر** از نسخهٔ Electron قبلی، با تمام امکانات.

            **سازندگان / Creators:** امیرمحمد گلستان • متین کتویی زاده
            (AmirMohammad Golestan & Matin Katooei-zadeh)

            ### دانلود / Download
            | فایل | توضیح |
            |---|---|
            | `MATIN-CHESS-${{ github.ref_name }}-windows-setup.zip` | **پیشنهادی** — نصب‌کنندهٔ کامل، فشرده‌شده با حداکثر فشار |
            | `MATIN-CHESS-${{ github.ref_name }}-windows-setup.exe` | نصب‌کنندهٔ کامل (میان‌بر دسکتاپ + منوی استارت) |
            | `MATIN-CHESS-${{ github.ref_name }}-windows-portable.exe` | تک‌فایل — بدون نصب، فقط اجرا کن |

            ### تازه‌های این نسخه (v3.2.0)
            - **سطح آخر هر موتور = تمام قدرت واقعی آن**: مهارت ۲۰ + بدون سقف قوت + هش بزرگ + ۵ ثانیه فکر (استاک‌فیش ۱۶-۱۹، برسرک، فری) • هایِ ولتریکس سطح ۱۰ = ۵ ثانیه • لوزا عمق ۱۲ • گاربوچس ۳ ثانیه
            - **وارد کردن / خروجی موتورها با فایل**: بستهٔ `.mceng` بساز، با فلش یا شبکه به کامپیوتر دیگر ببر و همان‌جا نصب کن — کاملاً آفلاین (دکمه‌های 📥/📤 در بخش «بازی با هوش مصنوعی»؛ فایل‌های تکی js/wasm هم پذیرفته می‌شوند)
            - رفع باگ: بعد از خروج از بازی دیگر هیچ صدای حرکت مهره‌ها پخش نمی‌شود و بازی در پس‌زمینه ادامه نمی‌یابد
            - رفع باگ: بعد از بستن مسابقه برنامه دیگر هنگ یا کرش نمی‌کند (بازسازی خودکار موتور داخلی + آزادشدن فوری حافظهٔ موتورهای سنگین مثل استاک‌فیش ۱۹)
            - جریان «ربات ← نسخه ← سطح»، تماشای ربات‌ها، آهنگ منو با وقفهٔ ۳ ثانیه و صداهای واقعی حرکت/گرفتن — همه سر جایشان
            - **همهٔ ربات‌ها داخل خود برنامه از سورس رسمی سازنده دانلود می‌شوند** (هیچ موتوری از قبل نصب نیست، جز متین)

            > نکته: برنامه از WebView2 ویندوز استفاده می‌کند (روی ویندوز ۱۰/۱۱ به‌صورت پیش‌فرض نصب است).
            > نصب‌کننده در صورت نبودش خودش آن را نصب می‌کند.

            Windows 10/11 64-bit • Built with Tauri 2 + GitHub Actions
