<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Engine Lab v1.7.0</title>
<style>
  body{font-family:system-ui;background:#0d1117;color:#e6edf3;padding:16px}
  h1{font-size:18px;color:#f2c66d}
  .row{display:flex;gap:8px;align-items:center;padding:6px 8px;border-bottom:1px solid #21262d}
  .id{width:70px;font-weight:bold;color:#7dd3fc}
  .st{width:90px;font-weight:bold}
  .ok{color:#3fb950}.bad{color:#f85149}.run{color:#d29922}
  .det{flex:1;font-size:11px;color:#8b949e;direction:ltr;text-align:left;white-space:pre-wrap;word-break:break-all;max-height:60px;overflow:auto}
  button{background:#238636;color:#fff;border:0;border-radius:6px;padding:8px 16px;font-size:14px;margin-bottom:12px}
</style>
</head>
<body>
<h1>Engine Lab — v1.7.0 battery</h1>
<button id="run">RUN ALL</button>
<pre id="log" style="color:#8b949e;font-size:11px"></pre>
<div id="grid"></div>
<script>
// ---- patch rules (mirrors app's downloadBot patch:true) ----
function patchGlue(txt, engine){
  // universal: redirect wasm URL (blob)
  txt = txt.replace('locateFile:function(file){return file}','locateFile:function(file){return self.BOT_WASM_URL||file}');
  txt = txt.replace('locateFile:function(e){return e}','locateFile:function(e){return self.BOT_WASM_URL||e}');
  txt = txt.replace('location.origin+location.pathname.replace(/\\.js$/i,".wasm")','(self.BOT_WASM_URL||location.origin+location.pathname.replace(/\\.js$/i,".wasm"))');
  // targeted: sf9 (nmruzz cache-bust locateFile)
  txt = txt.replace('locateFile:function(e){return e+"?v=e60effbb"}','locateFile:function(e){return self.BOT_WASM_URL||e}');
  // targeted: sf11 (niklasf-era)
  txt = txt.replace('wasmBinaryFile=Module.wasmBinaryFile||"stockfish.wasm"','wasmBinaryFile=Module.wasmBinaryFile||self.BOT_WASM_URL||"stockfish.wasm"');
  // targeted: sf16 (niklasf/hi-ogawa hash loader)
  txt = txt.replace('r=decodeURIComponent(o[0]||"stockfish-nnue-16-single.wasm")','r=decodeURIComponent(o[0]||self.BOT_WASM_URL)');
  if(engine.wasm && engine.injectModule){
    // glue clobbers Module -> inject wasmBinary + net feeder via text patch
    const feeder = engine.net
      ? ',onRuntimeInitialized:function(){try{Module.FS.writeFile(self.BOT_NET_NAME,new Uint8Array(self.BOT_NET_BYTES));self.postMessage("##NETREADY");}catch(e){self.postMessage("##NETFAIL "+e);}}'
      : '';
    txt = txt.replace('var Module={}','var Module={wasmBinary:self.BOT_WASM_BYTES'+feeder+'}');
  }
  if(engine.wasm && engine.honorModule){
    // predefine happens in boot via self.__MODULE_PRE
  }
  return txt;
}

const ENGINES=[
  {id:'sf6',  glue:'bots/sf6.js'},
  {id:'sf8',  glue:'bots/sf8.js'},
  {id:'sf9',  glue:'bots/sf9.js',  wasm:'bots/sf9.wasm'},
  {id:'sf10', glue:'bots/stockfish.wasm.js', wasm:'bots/stockfish.wasm'},
  {id:'sf11', glue:'bots/sf11.js', wasm:'bots/sf11.wasm'},
  {id:'sf12', glue:'bots/sf12.js', wasm:'bots/sf12.wasm', net:'bots/nn-82215d0fd0df.nnue', netName:'nn-82215d0fd0df.nnue', injectModule:true},
  {id:'sf14', glue:'bots/sf14.js', wasm:'bots/sf14.wasm', net:'bots/nn-13406b1dcbe0.nnue', netName:'nn-13406b1dcbe0.nnue', injectModule:true},
  {id:'sf15', glue:'bots/sf15.js', wasm:'bots/sf15.wasm', net:'bots/nn-6877cd24400e.nnue', netName:'nn-6877cd24400e.nnue', injectModule:true},
  {id:'sf16', glue:'bots/sf16.js', wasm:'bots/sf16.wasm', mode:'hash'},
  {id:'sf17', glue:'bots/sf17.js', wasm:'bots/sf17.wasm'},
  {id:'sf18', glue:'bots/sf18.js', wasm:'bots/sf18.wasm'},
  {id:'sf19', glue:'bots/stockfish-19-single.js', wasm:'bots/stockfish-19-single.wasm'}
];

function log(s){ document.getElementById('log').textContent+=s+"\n"; }

async function runOne(engine){
  const row=document.createElement('div'); row.className='row';
  row.innerHTML=`<span class="id">${engine.id}</span><span class="st run">RUN…</span><span class="det"></span>`;
  document.getElementById('grid').appendChild(row);
  const st=row.querySelector('.st'), det=row.querySelector('.det');
  const t0=Date.now(); const detail=[];
  const note=(s)=>{ detail.push(s); det.textContent=detail.join("\n"); };
  try{
    // 1) fetch glue text + patch
    let glueText = await (await fetch(engine.glue)).text();
    glueText = patchGlue(glueText, engine);
    const glueURL = URL.createObjectURL(new Blob([glueText],{type:'application/javascript'}));

    if(engine.mode==='hash'){
      // niklasf loader: spawn worker directly on glue URL with #wasmURL,worker hash
      const w=new Worker(glueURL+"#"+encodeURIComponent(new URL(engine.wasm,location).href)+",worker");
      const finish=(status,extra)=>{ clearTimeout(kill); try{w.terminate();}catch(e){}
        st.textContent=status; st.className='st '+(status==='PASS'?'ok':'bad');
        if(extra)note(extra); document.getElementById('log').textContent+=engine.id+' -> '+status+"\n";
        return {id:engine.id,status,det:detail.join(' | ')}; };
      let stage=0, skill=null;
      const kill=setTimeout(()=>finish('FAIL','timeout stage '+stage),60000);
      const send=(m)=>{ try{w.postMessage(m);}catch(e){} };
      w.onmessage=(e)=>{ const line=String(e.data).trim();
        if(line.startsWith('option name Skill Level')){ const m=line.match(/min (\d+) max (\d+)/); if(m)skill=m[1]+'-'+m[2]; }
        if(stage===0&&line==='uciok'){ stage=1; note('uciok '+(skill||'')+' '+((Date.now()-t0)/1000).toFixed(1)+'s'); send('isready'); }
        else if(stage===1&&line==='readyok'){ stage=2; send('ucinewgame'); send('position startpos moves e2e4 e7e5 g1f3 b8c6'); send('go depth 8'); }
        else if(stage===2&&line.startsWith('bestmove')){ finish('PASS','best '+(line.split(/\s+/)[1]||'')+' '+(skill||'')+' '+((Date.now()-t0)/1000).toFixed(1)+'s'); } };
      w.onerror=(e)=>finish('FAIL','err '+(e.message||'?'));
      return {id:engine.id,status:'RUN',det:''};
    }

    // 2) boot script
    let boot=`self.addEventListener('error',function(e){self.postMessage('##WERR '+(e.message||'?'));});`+
      `self.addEventListener('unhandledrejection',function(e){self.postMessage('##WREJ '+((e.reason&&e.reason.message)||e.reason));});`;
    if(engine.wasm){
      boot+=`self.BOT_WASM_URL="${new URL(engine.wasm,location).href}";`;
      if(engine.net){
        boot+=`self.BOT_NET_URL="${new URL(engine.net,location).href}";self.BOT_NET_NAME=${JSON.stringify(engine.netName)};`;
        boot+='fetch(self.BOT_NET_URL).then(r=>r.arrayBuffer()).then(b=>{self.BOT_NET_BYTES=new Uint8Array(b);self.postMessage("##NETBYTES");}).catch(e=>self.postMessage("##NETBYTEFAIL "+e));';
      }
    }
    if(engine.wasm && engine.honorModule){
      // predefine self.Module BEFORE importScripts (glue's var Module=typeof Module!=='undefined'... picks it up)
      const feeder = engine.net
        ? `,onRuntimeInitialized:function(){try{Module.FS.writeFile(self.BOT_NET_NAME,new Uint8Array(self.BOT_NET_BYTES));self.postMessage("##NETREADY");}catch(e){self.postMessage("##NETFAIL "+e);}}`
        : '';
      boot = `self.BOT_WASM_URL="${new URL(engine.wasm,location).href}";`+
        (engine.net?`self.BOT_NET_URL="${new URL(engine.net,location).href}";self.BOT_NET_NAME=${JSON.stringify(engine.netName)};`+
          `fetch(self.BOT_NET_URL).then(r=>r.arrayBuffer()).then(b=>{self.BOT_NET_BYTES=new Uint8Array(b);self.postMessage("##NETBYTES");});`:'')+
        `(async()=>{try{const r=await fetch(self.BOT_WASM_URL);self.Module={wasmBinary:await r.arrayBuffer(),print:function(s){self.postMessage(s)},printErr:function(s){self.postMessage('##E '+s)}}${feeder};`+
        `importScripts(${JSON.stringify(glueURL)});self.postMessage('##BOOTED');}catch(e){self.postMessage('##BOOTFAIL '+(e.message||e))};})();`;
    } else {
      boot+=`importScripts(${JSON.stringify(glueURL)});self.postMessage('##BOOTED');`;
    }
    const w=new Worker(URL.createObjectURL(new Blob([boot],{type:'application/javascript'})));
    const finish=(status,extra)=>{ clearTimeout(kill); try{w.terminate();}catch(e){}
      st.textContent=status; st.className='st '+(status==='PASS'?'ok':'bad');
      if(extra)note(extra);
      document.getElementById('log').textContent+=engine.id+' -> '+status+"\n";
      return {id:engine.id,status,det:detail.join(' | ')}; };
    let stage=0, skill=null, netReady = engine.net?false:true;
    const kill=setTimeout(()=>finish('FAIL','timeout @'+((Date.now()-t0)/1000).toFixed(1)+'s stage '+stage),150000);
    const send=(m)=>{ try{w.postMessage(m);}catch(e){} };
    w.onmessage=(e)=>{
      const line=String(e.data).trim();
      if(line.startsWith('##')){
        note(line);
        if(line==='##NETREADY')netReady=true;
        return;
      }
      if(line.startsWith('option name Skill Level')){ const m=line.match(/min (\d+) max (\d+)/); if(m)skill=m[1]+'-'+m[2]; }
      if(stage===0&&line==='uciok'){ stage=1; note('uciok '+(skill?('skill '+skill):'')+' '+((Date.now()-t0)/1000).toFixed(1)+'s'); send('isready'); }
      else if(stage===1&&line==='readyok'){ stage=2; send('ucinewgame'); send('position startpos moves e2e4 e7e5 g1f3 b8c6'); send(engine.id==='sf6'?'go depth 5':'go depth 8'); }
      else if(stage===2&&line.startsWith('bestmove')){ finish('PASS','best '+(line.split(/\s+/)[1]||'')+' '+(skill?('skill['+skill+']'):'')+' '+((Date.now()-t0)/1000).toFixed(1)+'s'); }
    };
    w.onerror=(e)=>{ finish('FAIL','worker error: '+(e.message||'unknown')+' @'+((Date.now()-t0)/1000).toFixed(1)+'s'); };
    const kick=()=>{ if(stage===0&&netReady){ note('sending uci'); send('uci'); } };
    setTimeout(kick, engine.net?1500:400);
    setInterval(kick, 2000);
  }catch(err){
    st.textContent='FAIL'; st.className='st bad'; det.textContent=String(err);
    document.getElementById('log').textContent+=engine.id+' -> FAIL '+err+"\n";
    return {id:engine.id,status:'FAIL',det:String(err)};
  }
}

document.getElementById('run').onclick=async()=>{
  document.getElementById('grid').innerHTML=''; document.getElementById('log').textContent='';
  for(const eng of ENGINES){ await runOne(eng); }
  log('=== ALL DONE ===');
};
</script>
</body>
</html>
