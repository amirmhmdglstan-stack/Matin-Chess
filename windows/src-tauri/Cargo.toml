[package]
name = "matin-chess"
version = "3.4.0"
description = "MATIN CHESS — Windows Desktop Edition (same look & engines as the Android app)"
authors = ["AmirMohammad Golestan & Matin Katooei-zadeh"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"
base64 = "0.22"
rfd = "0.15"

# size-optimized release build (user request: smallest possible exe, same content)
[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true
